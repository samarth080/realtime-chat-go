<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body {
        background: #0d0d1a;
        color: #ededef;
        font-family: 'JetBrains Mono', monospace;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.6); }
      ::selection { background: rgba(99,102,241,0.4); }

      @keyframes glow-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes neon-flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.6; }
        97% { opacity: 1; }
        98% { opacity: 0.4; }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes bounce-dot {
        0%, 80%, 100% { transform: translateY(0); }
        40%           { transform: translateY(-6px); }
      }
      .animate-slide-up  { animation: slide-up 0.25s cubic-bezier(0.16,1,0.3,1) both; }
      .animate-fade-in   { animation: fade-in 0.2s ease both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
